; KEEP THIS FILE PURE ASCII -- do not put CJK characters here.
;
; iniconfig reads this file using the LOCALE encoding, not UTF-8. On a Chinese
; Windows box the locale is cp936, so a single CJK character here makes pytest
; crash while PARSING CONFIG, before a single test runs:
;
;     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 in position 175
;
; The traceback is entirely inside iniconfig and has nothing to do with the
; code under test, so it is very hard to trace back to "config file encoding".
; Worse, it is environment-dependent: fine on a UTF-8 locale, broken on Chinese
; Windows. The Chinese rationale lives in conftest.py's module docstring, which
; Python reads as UTF-8 and is therefore unaffected. See the section
; "why pytest.ini must stay ASCII".

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; "-m 'not integration'" MUST stay in addopts. Declaring the marker under
; [markers] only documents it -- it does not deselect anything. Without this
; line a plain `pytest` run silently hits the real DeepSeek API: slow, costs
; money, and the result then depends on the network.
addopts = -ra --strict-markers --tb=short -m "not integration"

; auto mode: `async def test_xxx` runs without a per-test @pytest.mark.asyncio.
; The API-layer tests poll background tasks; the sync style would need bare
; sleeps and is very hard to get right.
asyncio_mode = auto

markers =
    integration: needs real external deps (network API / GPU / database).
                 Not run by default. Run explicitly: pytest -m integration

filterwarnings =
    ignore::DeprecationWarning
