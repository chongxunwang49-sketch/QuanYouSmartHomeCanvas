[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; -m "not integration" 必须留着：markers 里声明了「默认不跑」，
; 但只有写进 addopts 才真的不跑。缺了这一条，日常 pytest 会静默地
; 打真实 DeepSeek API —— 慢、花钱、且测试结果依赖网络。
addopts = -ra --strict-markers --tb=short -m "not integration"
; auto 模式：`async def test_xxx` 直接可跑，不必每个都挂 @pytest.mark.asyncio。
; 接口层测试要轮询后台任务，同步写法只能靠 sleep 硬等，很难写对。
asyncio_mode = auto
markers =
    integration: 需要真实外部依赖（网络 API / GPU / 数据库）的测试，默认不跑。
                 显式运行：pytest -m integration
filterwarnings =
    ignore::DeprecationWarning
