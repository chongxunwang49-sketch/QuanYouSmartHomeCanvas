# ═══════════════════════════════════════════════════════════════════
# qy-nginx —— 托管前端静态产物 + 反代后端
# ═══════════════════════════════════════════════════════════════════
# 拓扑依据：docs/需求/需求文档.md §3.2（第 1072 行起）
#   「4 | qy-nginx | nginx:alpine | ~15 MB | 127.0.0.1:80:80」
#
# ⚠️ **为什么必须反代，而不是让前端直接跨源调 :8000**
#
# 两条独立的理由，任一条都足够：
#
# 1. **同源是唯一能让 CORS 问题消失的办法。**
#    后端 main.py:101-109 的 CORS 白名单是**硬编码**的，只放行
#    localhost:5173 / 127.0.0.1:5173 / :3000 两个端口 —— **不含 80 端口**。
#    （config.py:46-55 另有一份内容不同的白名单，且它才是需求文档
#     附录 B.6 要求的那个；main.py 没读它，属于既存缺陷。）
#    在 80 端口上跨源调 :8000 会被浏览器直接拦掉。
#    反代之后前端与 API 同源，CORS 根本不参与判定，那个缺陷也就不咬人了。
#
# 2. **前端产物本来就是按相对路径写的。**
#    frontend/src/api/client.ts 的 axios baseURL 是 `/api/v1`（相对），
#    vite dev 也是靠 proxy 转发的。所以 dist/ **不需要重新构建**
#    就能直接放到 nginx 后面跑 —— 这也是「不跑 node 容器」能成立的原因。
#
# ⚠️ 端口绑定：容器内 listen 80，宿主侧由 compose 绑死 127.0.0.1:80。
#    绝不在 compose 里写 "80:80"（等价 0.0.0.0）—— 见 AC-37 与附录 B.6。

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 关掉版本号回显，少暴露一点信息
    server_tokens off;

    # ── gzip ──────────────────────────────────────────────────────
    # 产物里 JS 合计约 1.7 MB，gzip 后约 400 KB，值得开。
    # 字体（woff2）已经压过了，再压没收益，所以不列进 gzip_types。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ── 前端路由（history 模式）────────────────────────────────────
    # vue-router 用的是 createWebHistory，/parse 这类路径在磁盘上
    # 并不存在同名文件。没有这条 try_files，用户在 /parse 上按 F5
    # 会拿到 nginx 的 404 —— 而 dev 模式（vite）从来不会有这个问题，
    # 所以这是个「切到 compose 模式才突然冒出来」的坑。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存；index.html 不能缓存，
    # 否则用户永远打不到新版本。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── 后端 API ──────────────────────────────────────────────────
    location /api/ {
        # proxy_pass 后面**不带路径部分**，nginx 才会原样透传 URI。
        # 写成 `http://qy-backend:8000/`（带尾斜杠）会把 /api/ 前缀吃掉，
        # 后端拿到的变成 /v1/layout/parse —— 404，而且很难一眼看出。
        proxy_pass http://qy-backend:8000;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # trace_id 是后端 main.py 支持的请求头（TRACE_HEADER）。
        # 前端 client.ts 每个请求都会带，这里透传，别让它死在代理这一层。
        proxy_set_header   X-Trace-Id        $http_x_trace_id;

        # ⚠️ **超时按实测值给，不是默认的 60s。**
        # 实测：户型解析 33–48s、方案生成约 95s。这三条是**异步接口**，
        # 理论上立即返回 task_id，但握手与排队仍可能很慢；
        # 而 /plan.svg 之类的同步接口是真会算的。
        # vite dev 的 proxy 也给到 300s（vite.config.ts 的 proxyTimeout），
        # 两边保持一致，避免「dev 能跑、compose 模式超时」这种割裂。
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 后端已自己设了 Cache-Control（/task/{id}/status 是 no-store、
        # /plan.svg 是 private,max-age=300），nginx 不要插手覆盖。
        proxy_buffering off;
    }

    # ── 静态资源（vite dev 里 /static 也走同一后端）────────────────
    # 目前后端没有实际挂载 /static，但 vite.config.ts 为它配了代理，
    # 这里保持对称，免得将来后端加了静态目录却只有 dev 模式能用。
    location /static/ {
        proxy_pass http://qy-backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
